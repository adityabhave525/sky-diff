<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lightweight Diff Checker</title>
    <style>
        :root {
            --bg-color: #f9f9f9;
            --border-color: #ddd;
            --add-bg: #e6ffec;
            --add-text: #24292e;
            --add-highlight: #acf2bd;
            --rem-bg: #ffeef0;
            --rem-text: #24292e;
            --rem-highlight: #fdb8c0;
            --equal-bg: #ffffff;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            margin: 20px;
            background-color: var(--bg-color);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .inputs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        textarea {
            width: 100%;
            height: 300px;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-family: monospace;
            resize: vertical;
            box-sizing: border-box;
        }

        button {
            padding: 10px 20px;
            background-color: #0366d6;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
        }

        button:hover { background-color: #0256b9; }

        /* Diff Styling */
        #diff-output {
            margin-top: 20px;
            border: 1px solid var(--border-color);
            background: white;
            border-radius: 4px;
            overflow: hidden;
            font-family: monospace;
            white-space: pre-wrap;
            line-height: 1.5;
        }

        .diff-row {
            display: flex;
            border-bottom: 1px solid #eee;
        }

        .ln {
            width: 50px;
            padding: 0 10px;
            text-align: right;
            color: #999;
            user-select: none;
            border-right: 1px solid #eee;
            background-color: #f6f8fa;
        }

        .content {
            padding: 0 15px;
            flex-grow: 1;
            word-break: break-all;
        }

        .added { background-color: var(--add-bg); color: var(--add-text); }
        .removed { background-color: var(--rem-bg); color: var(--rem-text); }
        
        /* Inner highlighting */
        .added ins { background-color: var(--add-highlight); text-decoration: none; }
        .removed del { background-color: var(--rem-highlight); text-decoration: none; }
        
        .prefix {
            width: 20px;
            display: inline-block;
            user-select: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Lightweight Diff Checker</h2>
    <div class="inputs">
        <div>
            <label>Original Text</label>
            <textarea id="text-old" placeholder="Paste old version here...">console.log('hello')</textarea>
        </div>
        <div>
            <label>Modified Text</label>
            <textarea id="text-new" placeholder="Paste new version here...">console.log('hello world')</textarea>
        </div>
    </div>
    <button onclick="runDiff()">Compare Files</button>

    <div id="diff-output"></div>
</div>

<script>
    /**
     * Minimal Myers Diff Implementation
     * Returns a list of edits: { operation: 0|-1|1, text: string }
     * 0 = Equal, -1 = Removed, 1 = Added
     */
    function myersDiff(a, b) {
        const n = a.length;
        const m = b.length;
        const v = { 1: 0 };
        const trace = [];

        for (let d = 0; d <= n + m; d++) {
            const v_copy = Object.assign({}, v);
            for (let k = -d; k <= d; k += 2) {
                let x, y;
                if (k === -d || (k !== d && v[k - 1] < v[k + 1])) {
                    x = v[k + 1];
                } else {
                    x = v[k - 1] + 1;
                }
                y = x - k;
                while (x < n && y < m && a[x] === b[y]) {
                    x++; y++;
                }
                v[k] = x;
                if (x >= n && y >= m) {
                    return backtrack(a, b, trace.concat([v_copy]), n, m);
                }
            }
            trace.push(v_copy);
        }
    }

    function backtrack(a, b, trace, n, m) {
        const result = [];
        let x = n, y = m;

        for (let d = trace.length - 1; d >= 0; d--) {
            const v = trace[d];
            const k = x - y;
            let prev_k;
            if (k === -d || (k !== d && v[k - 1] < v[k + 1])) {
                prev_k = k + 1;
            } else {
                prev_k = k - 1;
            }
            const prev_x = v[prev_k];
            const prev_y = prev_x - prev_k;

            while (x > prev_x && y > prev_y) {
                result.unshift({ op: 0, val: a[x - 1] });
                x--; y--;
            }
            if (d > 0) {
                if (x > prev_x) result.unshift({ op: -1, val: a[x - 1] });
                else if (y > prev_y) result.unshift({ op: 1, val: b[y - 1] });
            }
            x = prev_x; y = prev_y;
        }
        return result;
    }

    function runDiff() {
        const oldText = document.getElementById('text-old').value;
        const newText = document.getElementById('text-new').value;
        const output = document.getElementById('diff-output');
        output.innerHTML = '';

        const oldLines = oldText.split(/\r?\n/);
        const newLines = newText.split(/\r?\n/);

        // 1. Line-level Diff
        const lineDiffs = myersDiff(oldLines, newLines);
        
        let oldLineNum = 1;
        let newLineNum = 1;

        // 2. Rendering & Intraline Highlighting logic
        for (let i = 0; i < lineDiffs.length; i++) {
            const current = lineDiffs[i];
            const next = lineDiffs[i+1];

            // If a removal is followed by an addition, it's likely a modification.
            // We perform character-level diffing on those specific lines.
            if (current.op === -1 && next && next.op === 1) {
                const charDiffs = myersDiff(current.val.split(''), next.val.split(''));
                
                // Render Removed Line with <del>
                renderRow(-1, oldLineNum++, '', formatCharDiff(charDiffs, -1));
                // Render Added Line with <ins>
                renderRow(1, '', newLineNum++, formatCharDiff(charDiffs, 1));
                i++; // Skip the 'next' we just processed
            } else {
                if (current.op === 0) {
                    renderRow(0, oldLineNum++, newLineNum++, current.val);
                } else if (current.op === -1) {
                    renderRow(-1, oldLineNum++, '', current.val);
                } else {
                    renderRow(1, '', newLineNum++, current.val);
                }
            }
        }
    }

    function formatCharDiff(charDiffs, type) {
        return charDiffs.map(c => {
            if (c.op === 0) return escapeHtml(c.val);
            if (c.op === type && type === -1) return `<del>${escapeHtml(c.val)}</del>`;
            if (c.op === type && type === 1) return `<ins>${escapeHtml(c.val)}</ins>`;
            return '';
        }).join('');
    }

    function renderRow(op, lnOld, lnNew, content) {
        const output = document.getElementById('diff-output');
        const className = op === 1 ? 'added' : op === -1 ? 'removed' : 'equal';
        const prefix = op === 1 ? '+' : op === -1 ? '-' : ' ';

        const row = document.createElement('div');
        row.className = `diff-row ${className}`;
        row.innerHTML = `
            <div class="ln">${lnOld}</div>
            <div class="ln">${lnNew}</div>
            <div class="content"><span class="prefix">${prefix}</span>${content}</div>
        `;
        output.appendChild(row);
    }

    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    // Run once on load
    runDiff();
</script>

</body>
</html>
