<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Lightweight Diff Checker</title>
        <style>
            :root {
                --bg-color: #f9f9f9;
                --border-color: #ddd;
                --primary-color: #0366d6;
                --primary-hover: #0256b9;
                --add-bg: #e6ffec;
                --add-text: #24292e;
                --add-highlight: #acf2bd;
                --rem-bg: #ffeef0;
                --rem-text: #24292e;
                --rem-highlight: #fdb8c0;
            }

            body {
                font-family:
                    -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica,
                    Arial, sans-serif;
                margin: 20px;
                background-color: var(--bg-color);
            }

            .container {
                max-width: 1200px;
                margin: 0 auto;
            }

            .inputs {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 20px;
                margin-bottom: 20px;
            }

            /* Input Header (Label + Buttons) */
            .input-header {
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin-bottom: 8px;
            }

            .input-header label {
                font-weight: 600;
                font-size: 14px;
                color: #333;
            }

            .action-group {
                display: flex;
                gap: 8px;
            }

            /* Action Buttons (Small) */
            .btn-action {
                padding: 4px 10px;
                font-size: 12px;
                background-color: #f0f0f0;
                border: 1px solid #ccc;
                border-radius: 4px;
                cursor: pointer;
                transition: background 0.2s;
                color: #333;
            }

            .btn-action:hover {
                background-color: #e0e0e0;
            }

            textarea {
                width: 100%;
                height: 300px;
                padding: 10px;
                border: 1px solid var(--border-color);
                border-radius: 4px;
                font-family: monospace;
                font-size: 13px;
                resize: vertical;
                box-sizing: border-box;
            }

            /* Primary Compare Button */
            .btn-primary {
                padding: 10px 20px;
                background-color: var(--primary-color);
                color: white;
                border: none;
                border-radius: 4px;
                cursor: pointer;
                font-size: 16px;
                font-weight: 600;
            }

            .btn-primary:hover {
                background-color: var(--primary-hover);
            }

            /* Diff Styling */
            #diff-output {
                margin-top: 20px;
                border: 1px solid var(--border-color);
                background: white;
                border-radius: 4px;
                overflow: hidden;
                font-family: monospace;
                font-size: 13px;
                white-space: pre-wrap;
                line-height: 1.5;
            }

            .diff-row {
                display: flex;
                border-bottom: 1px solid #eee;
            }

            .ln {
                width: 50px;
                padding: 0 10px;
                text-align: right;
                color: #bbb;
                user-select: none;
                border-right: 1px solid #eee;
                background-color: #f6f8fa;
            }

            .content {
                padding: 0 15px;
                flex-grow: 1;
                word-break: break-all;
            }

            .added {
                background-color: var(--add-bg);
                color: var(--add-text);
            }
            .removed {
                background-color: var(--rem-bg);
                color: var(--rem-text);
            }

            .added ins {
                background-color: var(--add-highlight);
                text-decoration: none;
            }
            .removed del {
                background-color: var(--rem-highlight);
                text-decoration: none;
            }

            .prefix {
                width: 20px;
                display: inline-block;
                user-select: none;
                color: #999;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <h2>Lightweight Diff Checker</h2>

            <div class="inputs">
                <!-- Original Text Column -->
                <div>
                    <div class="input-header">
                        <label>Original Text</label>
                        <div class="action-group">
                            <button
                                class="btn-action"
                                onclick="copyText('text-old', this)"
                            >
                                Copy
                            </button>
                            <button
                                class="btn-action"
                                onclick="clearText('text-old')"
                            >
                                Clear
                            </button>
                        </div>
                    </div>
                    <textarea
                        id="text-old"
                        placeholder="Paste old version here..."
                    >
console.log('hello')</textarea
                    >
                </div>

                <!-- Modified Text Column -->
                <div>
                    <div class="input-header">
                        <label>Modified Text</label>
                        <div class="action-group">
                            <button
                                class="btn-action"
                                onclick="copyText('text-new', this)"
                            >
                                Copy
                            </button>
                            <button
                                class="btn-action"
                                onclick="clearText('text-new')"
                            >
                                Clear
                            </button>
                        </div>
                    </div>
                    <textarea
                        id="text-new"
                        placeholder="Paste new version here..."
                    >
console.log('hello world')</textarea
                    >
                </div>
            </div>

            <button class="btn-primary" onclick="runDiff()">
                Compare Files
            </button>

            <div id="diff-output"></div>
        </div>

        <script>
            // --- Helper Functions for Buttons ---

            function clearText(elementId) {
                document.getElementById(elementId).value = "";
                document.getElementById(elementId).focus();
            }

            async function copyText(elementId, btnElement) {
                const text = document.getElementById(elementId).value;
                try {
                    await navigator.clipboard.writeText(text);

                    // Visual feedback
                    const originalText = btnElement.innerText;
                    btnElement.innerText = "Copied!";
                    btnElement.style.backgroundColor = "#d4edda"; // Light green

                    setTimeout(() => {
                        btnElement.innerText = originalText;
                        btnElement.style.backgroundColor = ""; // Reset
                    }, 2000);
                } catch (err) {
                    alert("Failed to copy text.");
                    console.error(err);
                }
            }

            // --- Core Diff Logic (Myers Algorithm) ---

            function myersDiff(a, b) {
                const n = a.length;
                const m = b.length;
                const v = { 1: 0 };
                const trace = [];

                for (let d = 0; d <= n + m; d++) {
                    const v_copy = Object.assign({}, v);
                    for (let k = -d; k <= d; k += 2) {
                        let x, y;
                        if (k === -d || (k !== d && v[k - 1] < v[k + 1])) {
                            x = v[k + 1];
                        } else {
                            x = v[k - 1] + 1;
                        }
                        y = x - k;
                        while (x < n && y < m && a[x] === b[y]) {
                            x++;
                            y++;
                        }
                        v[k] = x;
                        if (x >= n && y >= m) {
                            return backtrack(
                                a,
                                b,
                                trace.concat([v_copy]),
                                n,
                                m,
                            );
                        }
                    }
                    trace.push(v_copy);
                }
            }

            function backtrack(a, b, trace, n, m) {
                const result = [];
                let x = n,
                    y = m;

                for (let d = trace.length - 1; d >= 0; d--) {
                    const v = trace[d];
                    const k = x - y;
                    let prev_k;
                    if (k === -d || (k !== d && v[k - 1] < v[k + 1])) {
                        prev_k = k + 1;
                    } else {
                        prev_k = k - 1;
                    }
                    const prev_x = v[prev_k];
                    const prev_y = prev_x - prev_k;

                    while (x > prev_x && y > prev_y) {
                        result.unshift({ op: 0, val: a[x - 1] });
                        x--;
                        y--;
                    }
                    if (d > 0) {
                        if (x > prev_x)
                            result.unshift({ op: -1, val: a[x - 1] });
                        else if (y > prev_y)
                            result.unshift({ op: 1, val: b[y - 1] });
                    }
                    x = prev_x;
                    y = prev_y;
                }
                return result;
            }

            function runDiff() {
                const oldText = document.getElementById("text-old").value;
                const newText = document.getElementById("text-new").value;
                const output = document.getElementById("diff-output");
                output.innerHTML = "";

                const oldLines = oldText.split(/\r?\n/);
                const newLines = newText.split(/\r?\n/);

                // 1. Line-level Diff
                const lineDiffs = myersDiff(oldLines, newLines);

                let oldLineNum = 1;
                let newLineNum = 1;

                // 2. Rendering
                for (let i = 0; i < lineDiffs.length; i++) {
                    const current = lineDiffs[i];
                    const next = lineDiffs[i + 1];

                    // Check for modification (delete followed by add)
                    if (current.op === -1 && next && next.op === 1) {
                        const charDiffs = myersDiff(
                            current.val.split(""),
                            next.val.split(""),
                        );

                        renderRow(
                            -1,
                            oldLineNum++,
                            "",
                            formatCharDiff(charDiffs, -1),
                        );
                        renderRow(
                            1,
                            "",
                            newLineNum++,
                            formatCharDiff(charDiffs, 1),
                        );
                        i++;
                    } else {
                        if (current.op === 0) {
                            renderRow(
                                0,
                                oldLineNum++,
                                newLineNum++,
                                current.val,
                            );
                        } else if (current.op === -1) {
                            renderRow(-1, oldLineNum++, "", current.val);
                        } else {
                            renderRow(1, "", newLineNum++, current.val);
                        }
                    }
                }
            }

            function formatCharDiff(charDiffs, type) {
                return charDiffs
                    .map((c) => {
                        if (c.op === 0) return escapeHtml(c.val);
                        if (c.op === type && type === -1)
                            return `<del>${escapeHtml(c.val)}</del>`;
                        if (c.op === type && type === 1)
                            return `<ins>${escapeHtml(c.val)}</ins>`;
                        return "";
                    })
                    .join("");
            }

            function renderRow(op, lnOld, lnNew, content) {
                const output = document.getElementById("diff-output");
                const className =
                    op === 1 ? "added" : op === -1 ? "removed" : "equal";
                const prefix = op === 1 ? "+" : op === -1 ? "-" : " ";

                const row = document.createElement("div");
                row.className = `diff-row ${className}`;
                row.innerHTML = `
            <div class="ln">${lnOld}</div>
            <div class="ln">${lnNew}</div>
            <div class="content"><span class="prefix">${prefix}</span>${content}</div>
        `;
                output.appendChild(row);
            }

            function escapeHtml(text) {
                const div = document.createElement("div");
                div.textContent = text;
                return div.innerHTML;
            }

            // Run once on load
            runDiff();
        </script>
    </body>
</html>
